<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lanchonete</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Lanchonete
    </h1>
    <p>Calcule aqui o valor a pagar:</p>

    <div>
        <label for="codigo">Codigo do produto comprado:</label>
        <input type="number" id="codigo" placeholder="Digite aqui o codigo do produto:">
    </div>

    <div>
        <label for="quantidade">Quantidade comprada:</label>
        <input type="number" id="quantidade" placeholder="Digite aqui a quantidade do produto:">
    </div>

    <button>Calcular</button>

    <p id="resultado"></p>

    <script src="script.js"></script>
</body>
</html>
